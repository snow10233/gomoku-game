<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Gomoku Game technical banner</title>
  <desc id="desc">Portfolio banner for a C++ backend and Python PySide6 Gomoku desktop game.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.56" stop-color="#101827"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3c68f"/>
      <stop offset="1" stop-color="#b9965f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <path d="M0 436 C280 376 420 500 700 440 C980 380 1110 460 1600 390 L1600 520 L0 520 Z" fill="#1d2b3d" opacity="0.55"/>

  <g transform="translate(86 90)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#1f2d3f"/>
    <circle cx="35" cy="38" r="14" fill="#0a0d12"/>
    <circle cx="62" cy="62" r="14" fill="#f7f3e8" stroke="#0a0d12" stroke-width="3"/>
    <text x="126" y="38" fill="#9fb3c8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">GOMOKU GAME</text>
    <text x="0" y="164" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800">C++ Engine</text>
    <text x="0" y="236" fill="#39d98a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800">PySide6 Desktop UI</text>
    <text x="0" y="300" fill="#b8c7d6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28">A two-process Gomoku app with line-based IPC, AI mode, local multiplayer, save/load, and replay.</text>

    <g transform="translate(0 342)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
      <rect x="0" y="0" width="154" height="42" rx="21" fill="#223247"/>
      <text x="24" y="28" fill="#dce8f4">C++17</text>
      <rect x="174" y="0" width="154" height="42" rx="21" fill="#223247"/>
      <text x="198" y="28" fill="#dce8f4">Python 3.12</text>
      <rect x="348" y="0" width="132" height="42" rx="21" fill="#223247"/>
      <text x="372" y="28" fill="#dce8f4">PySide6</text>
      <rect x="500" y="0" width="190" height="42" rx="21" fill="#223247"/>
      <text x="524" y="28" fill="#dce8f4">stdin/stdout IPC</text>
    </g>
  </g>

  <g transform="translate(970 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="490" height="370" rx="28" fill="url(#board)" stroke="#f4dba7" stroke-width="2"/>
    <g stroke="#1d1710" stroke-width="3" opacity="0.86">
      <line x1="52" y1="52" x2="438" y2="52"/>
