      <circle cx="228" cy="140" r="18" fill="#080a0d"/>
      <circle cx="184" cy="184" r="18" fill="#f9f7ef" stroke="#111827" stroke-width="3"/>
      <circle cx="272" cy="184" r="18" fill="#080a0d"/>
      <circle cx="184" cy="228" r="18" fill="#f9f7ef" stroke="#111827" stroke-width="3"/>
      <circle cx="316" cy="228" r="18" fill="#080a0d"/>
      <circle cx="184" cy="272" r="18" fill="#f9f7ef" stroke="#111827" stroke-width="3"/>
