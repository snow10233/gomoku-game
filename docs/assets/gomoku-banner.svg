      <line x1="96" y1="52" x2="96" y2="316"/>
      <line x1="140" y1="52" x2="140" y2="316"/>
      <line x1="184" y1="52" x2="184" y2="316"/>
      <line x1="228" y1="52" x2="228" y2="316"/>
      <line x1="272" y1="52" x2="272" y2="316"/>
      <line x1="316" y1="52" x2="316" y2="316"/>
      <line x1="360" y1="52" x2="360" y2="316"/>
